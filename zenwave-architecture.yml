# yaml-language-server: $schema=https://schemas.zenwave360.io/zenwave-architecture/latest/schema.json

config:
  title: "Arcadia Editions - Event-Driven Retail Architecture"
  version: 0.0.1
  groupIdExpression: "com.arcadiaeditions.${owner.id}"
  artifactIdExpression: "${artifact.fileNameWithoutExtension}"
  contentResolution:
    - workspace
    - git
  sources:
    workspace:
      basePathExpression: "../${owner.repository}"
    git:
      provider: github
      server: "https://github.com"
      contentUrlExpression: "${server}/arcadia-editions/${owner.repository}/raw/main/${content.path}"

domains:
  "architecture":
    id: "architecture"
    name: "Architecture"
    description: "Cross-domain business flows, ADRs, and architecture documentation for the whole platform"
    repository: "arcadia-editions-architecture"
    artifacts:
      - type: zfl
        path: "business-flows/place-order-flow.zfl"
        version: "0.0.0"
    docs:
      content: README.md
      adrs: "adrs/"

  "catalog":
    id: "catalog"
    name: "Catalog & Inventory"
    description: "Product catalog, limited editions, inventory and drop management"
    subdomains:
      "catalog-management":
        id: "catalog.catalog-management"
        name: "Catalog Management"
        description: "Product catalog definition, publication lifecycle, and release metadata"
        services:
          "catalog-products":
            id: "catalog.catalog-management.catalog-products"
            repository: "catalog-products-api"
            version: "0.0.0"
            name: "Catalog Products"
            description: "Manages product catalog definitions, release metadata, and publication lifecycle"
            docs:
              summary: SUMMARY.md
              content: EVENT_CATALOG.md
              changelog: CHANGELOG.md
            artifacts:
              - type: zdl
                path: "domain-model.zdl"
                version: "0.0.0"
              - type: asyncapi
                path: "asyncapi.yml"
                version: "0.0.0"
              - type: asyncapi-client
                path: "asyncapi-client.yml"
                version: "0.0.0"
              - type: openapi
                path: "openapi.yml"
                version: "0.0.0"

      "inventory-management":
        id: "catalog.inventory-management"
        name: "Inventory Management"
        description: "Scarce stock reservation, release handling, and backoffice inventory operations"
        services:
          "catalog-inventory":
            id: "catalog.inventory-management.catalog-inventory"
            repository: "catalog-inventory-api"
            version: "0.0.0"
            name: "Catalog Inventory"
            description: "Owns scarce stock reservation, stock release, and inventory position management"
            docs:
              summary: SUMMARY.md
              content: EVENT_CATALOG.md
              changelog: CHANGELOG.md
            artifacts:
              - type: zdl
                path: "domain-model.zdl"
                version: "0.0.0"
              - type: asyncapi
                path: "asyncapi.yml"
                version: "0.0.0"
              - type: asyncapi-client
                path: "asyncapi-client.yml"
                version: "0.0.0"
              - type: openapi
                path: "openapi.yml"
                version: "0.0.0"
            consumers:
              - "orders.checkout.orders-checkout#asyncapi-client"
              - "orders.checkout.orders-checkout#openapi"

  "orders":
    id: "orders"
    name: "Orders"
    description: "Commercial order creation, confirmation, and cancellation"
    subdomains:
      "checkout":
        id: "orders.checkout"
        name: "Checkout"
        description: "Customer checkout, order commitment, and commercial orchestration"
        services:
          "orders-checkout":
            id: "orders.checkout.orders-checkout"
            repository: "orders-checkout-api"
            version: "0.0.0"
            name: "Orders Checkout"
            description: "Owns checkout flow, order lifecycle, and the handoff from purchase intent to confirmed order"
            docs:
              summary: SUMMARY.md
              content: EVENT_CATALOG.md
              changelog: CHANGELOG.md
            artifacts:
              - type: zdl
                path: "domain-model.zdl"
                version: "0.0.0"
              - type: asyncapi
                path: "asyncapi.yml"
                version: "0.1.1"
              - type: asyncapi-client
                path: "asyncapi-client.yml"
                version: "0.1.1"
              - type: openapi
                path: "openapi.yml"
                version: "0.0.0"
            consumers:
              - "payments.payment-processing.payments-processing#asyncapi-client"
              - "fulfillment.shipping.fulfillment-shipping#asyncapi-client"
              - "notifications.customer-communications.notifications-consumer#asyncapi-client"

  "payments":
    id: "payments"
    name: "Payments"
    description: "Payment authorization, retry, capture, and compensation"
    subdomains:
      "payment-processing":
        id: "payments.payment-processing"
        name: "Payment Processing"
        description: "Payment provider integration, lifecycle state, and compensation handling"
        services:
          "payments-processing":
            id: "payments.payment-processing.payments-processing"
            repository: "payments-processing-api"
            version: "0.0.0"
            name: "Payments Processing"
            description: "Owns payment authorization, retries, capture, voiding, and provider-facing outcomes"
            docs:
              summary: SUMMARY.md
              content: EVENT_CATALOG.md
              changelog: CHANGELOG.md
            artifacts:
              - type: zdl
                path: "domain-model.zdl"
                version: "0.0.0"
              - type: asyncapi
                path: "asyncapi.yml"
                version: "0.0.0"
              - type: asyncapi-client
                path: "asyncapi-client.yml"
                version: "0.0.0"
              - type: openapi
                path: "openapi.yml"
                version: "0.0.0"
            consumers:
              - "orders.checkout.orders-checkout#asyncapi-client"
              - "catalog.inventory-management.catalog-inventory#asyncapi-client"
              - "notifications.customer-communications.notifications-consumer#asyncapi-client"

  "fulfillment":
    id: "fulfillment"
    name: "Fulfillment"
    description: "Operational handling after order confirmation"
    subdomains:
      "shipping":
        id: "fulfillment.shipping"
        name: "Shipping"
        description: "Shipment scheduling, readiness, and fulfillment failure handling"
        services:
          "fulfillment-shipping":
            id: "fulfillment.shipping.fulfillment-shipping"
            repository: "fulfillment-shipping-api"
            version: "0.0.0"
            name: "Fulfillment Shipping"
            description: "Owns scheduling and readiness of shipping operations after an order is confirmed"
            docs:
              summary: SUMMARY.md
              content: EVENT_CATALOG.md
              changelog: CHANGELOG.md
            artifacts:
              - type: zdl
                path: "domain-model.zdl"
                version: "0.0.0"
              - type: asyncapi
                path: "asyncapi.yml"
                version: "0.0.0"
              - type: asyncapi-client
                path: "asyncapi-client.yml"
                version: "0.0.0"
              - type: openapi
                path: "openapi.yml"
                version: "0.0.0"
            consumers:
              - "payments.payment-processing.payments-processing#asyncapi-client"

  "notifications":
    id: "notifications"
    name: "Notifications"
    description: "Customer communication driven by domain outcomes"
    subdomains:
      "customer-communications":
        id: "notifications.customer-communications"
        name: "Customer Communications"
        description: "Notification delivery triggered by order, stock, and payment events"
        services:
          "notifications-consumer":
            id: "notifications.customer-communications.notifications-consumer"
            repository: "notifications-consumer-api"
            version: "0.0.0"
            name: "Notifications Consumer"
            description: "Transforms business outcomes into customer-facing notifications and delivery results"
            docs:
              summary: SUMMARY.md
              content: EVENT_CATALOG.md
              changelog: CHANGELOG.md
            artifacts:
              - type: zdl
                path: "domain-model.zdl"
                version: "0.0.0"
              - type: asyncapi
                path: "asyncapi.yml"
                version: "0.0.0"
              - type: asyncapi-client
                path: "asyncapi-client.yml"
                version: "0.0.0"
              - type: openapi
                path: "openapi.yml"
                version: "0.0.0"
